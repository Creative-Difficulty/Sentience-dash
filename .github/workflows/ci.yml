name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build never connects to a database, but src/lib/server/db/index.ts
      # requires DATABASE_URL to be set at import time (postbuild analyse).
      # Dummy value on purpose: CI has no database and no secrets.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (prettier + eslint)
        run: bun run lint

      - name: Type check (svelte-check)
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

  contract:
    name: drizzle schema vs unidb-schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      CONTRACT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout unidb-schema (source of truth for the database schema)
        uses: actions/checkout@v4
        with:
          repository: Vimothy-s-Vestibule/unidb-schema
          path: unidb-schema
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply unidb schema
        run: cat unidb-schema/schema/*.sql | psql -v ON_ERROR_STOP=1 -q "$CONTRACT_DATABASE_URL"

      - name: Contract test
        run: bun run test:contract
