name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build never connects to a database, but src/lib/server/db/index.ts
      # requires DATABASE_URL to be set at import time (postbuild analyse).
      # Dummy value on purpose: CI has no database and no secrets.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (prettier + eslint)
        run: bun run lint

      - name: Type check (svelte-check)
        run: bun run check

      - name: Build
        run: bun run build
